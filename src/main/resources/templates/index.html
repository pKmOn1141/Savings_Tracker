<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Savings Tracker</title>
</head>
<body>

<h1>Savings Tracker</h1>

<h2>Accounts</h2>
<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Balance</th>
            <th>Profit</th>
            <th>Total Deposited</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="account : ${accounts}">
            <td th:text="${account.id}"></td>
            <td th:text="${account.name}"></td>
            <td th:text="${account.totBalance}"></td>
            <td th:text="${account.totProfit}"></td>
            <td th:text="${account.totDeposit}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(accounts)}">
            <td colspan="5">No accounts yet.</td>
        </tr>
    </tbody>
</table>

<h2>Create New Account</h2>
<form action="/new_account" method="post">
    <label>ID: <input type="number" name="id" required/></label><br/>
    <label>Name: <input type="text" name="name" required/></label><br/>
    <label>Balance: <input type="number" step="0.01" name="totBalance" required/></label><br/>
    <label>Profit: <input type="number" step="0.01" name="totProfit" required/></label><br/>
    <label>Total Deposited: <input type="number" step="0.01" name="totDeposit" required/></label><br/>
    <button type="submit">Create Account</button>
</form>

</body>
</html>
