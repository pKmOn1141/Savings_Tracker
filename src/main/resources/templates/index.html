<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Savings Tracker</title>
</head>
<body>

<h1>Savings Tracker</h1>

<h2>Accounts</h2>
<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Balance</th>
            <th>Profit</th>
            <th>Total Deposited</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="account : ${accounts}">
            <td th:text="${account.id}"></td>
            <td th:text="${account.name}"></td>
            <td th:text="${account.totBalance}"></td>
            <td th:text="${account.totProfit}"></td>
            <td th:text="${account.totDeposit}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(accounts)}">
            <td colspan="5">No accounts yet.</td>
        </tr>
    </tbody>
</table>

<h2>Create New Account</h2>
<form action="/new_account" method="post">
    <label>Name: <input type="text" name="name" required/></label><br/>
    <button type="submit">Create Account</button>
</form>

<h2>View Account Entries</h2>
<form action="/entries" method="get">
    <label>Account Name: <input type="text" name="accountName" required/></label>
    <button type="submit">View Entries</button>
</form>

<div th:if="${entries != null}">
    <h3 th:text="'Entries for: ' + ${selectedAccount}"></h3>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Date</th>
                <th>Deposit Amount</th>
                <th>Account Balance</th>
                <th>Pound Change</th>
                <th>Percent Change</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="entry : ${entries}">
                <td th:text="${entry.id}"></td>
                <td th:text="${entry.date}"></td>
                <td th:text="${entry.depositAmount}"></td>
                <td th:text="${entry.accountBalance}"></td>
                <td th:text="${entry.poundChange}"></td>
                <td th:text="${entry.percentChange}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(entries)}">
                <td colspan="6">No entries yet.</td>
            </tr>
        </tbody>
    </table>
</div>

<h2>Create New Entry</h2>
<form action="/new_entry" method="post">
    <label>ID: <input type="number" name="id" required/></label><br/>
    <label>Name: <input type="text" name="name" required/></label><br/>
    <label>Date: <input type="text" name="date" required/></label><br/>
    <label>Deposit Amount: <input type="number" step="0.01" name="depositAmount" required/></label><br/>
    <label>Account Balance: <input type="number" step="0.01" name="accountBalance" required/></label><br/>
    <label>Pound Change: <input type="number" step="0.01" name="poundChange" required/></label><br/>
    <label>Percent Change: <input type="number" step="0.01" name="percentChange" required/></label><br/>
    <button type="submit">Create Account</button>
</form>

</body>
</html>
